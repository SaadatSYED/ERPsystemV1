<header class="erp-topbar">

  <!-- Left: Page title -->
  <div class="topbar-left">
    <h1 class="topbar-title">{{ pageTitle }}</h1>
  </div>

  <!-- Right: actions -->
  <div class="topbar-right">

    <!-- Notifications -->
    <button class="topbar-icon-btn" title="Notifications">
      <i class="bi bi-bell"></i>
      <span class="notif-dot"></span>
    </button>

    <!-- Theme toggle -->
    <button class="topbar-icon-btn" (click)="toggleTheme()" [title]="isDarkMode ? 'Switch to Light' : 'Switch to Dark'">
      <i class="bi" [ngClass]="isDarkMode ? 'bi-sun-fill' : 'bi-moon-fill'"></i>
    </button>

    <!-- User dropdown -->
    <div class="user-menu-wrap" (click)="$event.stopPropagation()">
      <button class="user-trigger" (click)="toggleDropdown()">
        <img src="assets/images/saadat.png" alt="User" class="user-avatar"
             onerror="this.src='https://www.w3schools.com/howto/img_avatar.png'" />
        <span class="user-name">Saadat</span>
        <i class="bi bi-chevron-down chev"></i>
      </button>

      @if (showDropdown) {
        <div class="user-dropdown">
          <div class="dd-header">
            <img src="assets/images/saadat.png" alt="User" class="dd-avatar"
                 onerror="this.src='https://www.w3schools.com/howto/img_avatar.png'" />
            <div>
              <div class="dd-name">Saadat Ahmed</div>
              <div class="dd-role">Administrator</div>
            </div>
          </div>
          <div class="dd-divider"></div>
          <a class="dd-item" routerLink="/setting" (click)="closeDropdown()">
            <i class="bi bi-gear-fill"></i> Settings
          </a>
          <button class="dd-item" (click)="toggleTheme(); closeDropdown()">
            <i class="bi" [ngClass]="isDarkMode ? 'bi-sun-fill' : 'bi-moon-fill'"></i>
            {{ isDarkMode ? 'Light Mode' : 'Dark Mode' }}
          </button>
          <div class="dd-divider"></div>
          <button class="dd-item dd-logout" (click)="logout()">
            <i class="bi bi-box-arrow-right"></i> Logout
          </button>
        </div>
      }
    </div>

  </div>
</header>
