<aside class="erp-sidebar">

  <!-- Brand / Logo -->
  <div class="sidebar-brand">
    <div class="brand-icon"><i class="bi bi-grid-3x3-gap-fill"></i></div>
    <span class="brand-name">ERP Pro</span>
  </div>

  <!-- Section Label -->
  <div class="sidebar-label">MAIN MENU</div>

  <!-- Nav Links -->
  <nav class="sidebar-nav">
    @for (item of menuItems; track item.link) {
      <a [routerLink]="item.link" routerLinkActive="is-active" class="sidebar-link">
        <i class="bi {{ item.icon }} sidebar-icon"></i>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <!-- Footer -->
  <div class="sidebar-footer">
    <img src="assets/images/saadat.png" alt="User" class="sf-avatar"
         onerror="this.src='https://www.w3schools.com/howto/img_avatar.png'" />
    <div class="sf-info">
      <span class="sf-name">Saadat</span>
      <span class="sf-role">Administrator</span>
    </div>
  </div>

</aside>
